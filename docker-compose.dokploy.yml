# Compose de production pour Dokploy.
# - Aucun port publié : le domaine HTTPS est attaché au service "nextjs" (port 3000) depuis l'interface Dokploy.
# - Toutes les valeurs sensibles viennent de l'onglet "Environment" de Dokploy.

services:
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${APP_URL:?APP_URL requis}
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:?APP_URL requis}
      NEXT_PUBLIC_APP_URL: ${APP_URL}
      AUTH_URL: ${APP_URL}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET requis}
      AUTH_TRUST_HOST: "true"
      DATABASE_URL: mysql://${DB_USER:-sodefor}:${DB_PASSWORD:?DB_PASSWORD requis}@mariadb:3306/${DB_NAME:-sodefor_presences}
      REDIS_URL: redis://redis:6379
      STORAGE_DRIVER: s3
      S3_ENDPOINT: ${S3_ENDPOINT:-http://storage:8333}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-sodefor-presences}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-sodefor}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY requis}
      S3_FORCE_PATH_STYLE: "true"
      SEED_ON_BOOT: ${SEED_ON_BOOT:-0}
      PRISMA_ACCEPT_DATA_LOSS: ${PRISMA_ACCEPT_DATA_LOSS:-0}
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy
    volumes:
      - app_storage:/data/storage

  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD requis}
      MARIADB_DATABASE: ${DB_NAME:-sodefor_presences}
      MARIADB_USER: ${DB_USER:-sodefor}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Stockage objet privé compatible S3 (signatures, PDF). Les images MinIO ne sont plus publiées publiquement ;
  # pour un S3 externe (AWS, MinIO sous licence…), renseigner S3_ENDPOINT et supprimer ce service.
  storage:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-sodefor}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '{"identities":[{"name":"app","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        exec weed server -dir=/data -ip=storage -ip.bind=0.0.0.0 -volume.max=0 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  mariadb_data:
  redis_data:
  storage_data:
  app_storage:
